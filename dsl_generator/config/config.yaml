# DSL Generator Configuration

# LLM Configuration
llm:
  provider: "openai"  # Options: openai, anthropic, ollama
  model: "gpt-5.1"  # Modello efficiente e veloce (gpt-4o-mini, gpt-4o, gpt-3.5-turbo)
  api_key: "${OPENAI_API_KEY}"  # Set via environment variable
  temperature: 0.2
  max_tokens: 8000  # RADDOPPIATO: 4000 → 8000 per DSL molto complessi
  encoding: "cl100k_base"  # Encoding per il tokenizer
  
  # Alternative configurations
  # For Anthropic:
  # provider: "anthropic"
  # model: "claude-3-opus-20240229"
  # api_key: "${ANTHROPIC_API_KEY}"
  
  # For local Ollama:
  # provider: "ollama"
  # model: "llama2"
  # base_url: "http://localhost:11434"

# RAG Configuration
rag:
  # Embedding model
  embedding_provider: "openai"  # Options: openai, huggingface, sentence-transformers
  embedding_model: "text-embedding-3-small"
  embedding_dimension: 1536
  
  # For HuggingFace embeddings:
  # embedding_provider: "huggingface"
  # embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  
  # Chunking strategy
  chunk_size: 4000  # RADDOPPIATO: 2000 → 4000
  chunk_overlap: 800  # RADDOPPIATO: 400 → 800
  
  # Vector store
  vector_store: "chromadb"  # Options: chromadb, faiss
  vector_store_path: "data/vector_db"
  collection_name: "dsl_documentation"
  
  # Retrieval
  top_k: 20  # RADDOPPIATO: 10 → 20
  similarity_threshold: 0.3  # Ulteriormente ridotto per massima copertura
  
  # Document processing
  supported_formats:
    - "md"
    - "txt"
    - "pdf"
    - "docx"

# DSL Configuration
dsl:
  # Output format
  output_format: "yaml"
  indent: 2
  
  # Validation
  validate: true
  strict_mode: false
  
  # Schema definition
  schema:
    wsp:
      required: ["name", "h_start", "h_end", "r_max"]
      types:
        name: "string"
        h_start: "integer"
        h_end: "integer"
        r_max: "integer"
    
    services:
      required: ["id", "name", "tasks_set"]
      types:
        id: "integer"
        name: "string"
        tasks_set: "list[integer]"
    
    tasks:
      required: ["id", "name", "sig", "dur", "res_q", "rc", "rd", "max_c"]
      types:
        id: "integer"
        name: "string"
        sig: "string"
        dur: "integer"
        res_q: "integer"
        rc: "integer"
        rd: "integer"
        max_c: "integer"
    
    start_constraints:
      required: ["from", "to", "delay", "wait_all"]
      types:
        from: "integer"
        to: "integer"
        delay: "integer"
        wait_all: "boolean"

# Pipeline Configuration
pipeline:
  # Processing steps
  steps:
    - "load_documents"
    - "create_embeddings"
    - "extract_information"
    - "generate_dsl"
    - "validate_dsl"
  
  # Retry configuration
  max_retries: 3
  retry_delay: 2
  
  # Logging
  log_level: "INFO"
  log_file: "logs/pipeline.log"
  
  # Output
  output_dir: "data/generated_dsl"
  save_intermediate: true

# Prompt Configuration
prompts:
  system_prompt_path: "config/prompts/system_prompt.txt"
  extraction_prompt_path: "config/prompts/extraction_prompt.txt"
  generation_prompt_path: "config/prompts/generation_prompt.txt"
  
  # Prompt parameters
  include_examples: true
  max_context_length: 8000
